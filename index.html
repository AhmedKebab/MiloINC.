<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050609" />
    <title>Examination</title>
    <link rel="icon" type="image/webp" href="favicon.webp" />
    <link rel="stylesheet" href="examination.css?v=smooth-motion-v18" />
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js?v=smooth-motion-v15" defer></script>
  </head>
  <body>
    <main class="showcase is-menu-active" aria-label="Examination">
      <div class="background-stage" aria-hidden="true">
        <img
          class="background-image"
          id="background-image"
          alt=""
          inert
        />
        <img
          class="background-image"
          id="background-image-next"
          alt=""
          inert
        />
      </div>
      <div class="showcase-shade" aria-hidden="true"></div>
      <div class="cinematic-mask" aria-hidden="true"></div>
      <div class="examination-frame">
        <div class="frame-corners" aria-hidden="true">
          <span class="frame-corner frame-corner--top-left"></span>
          <span class="frame-corner frame-corner--top-right"></span>
          <span class="frame-corner frame-corner--bottom-left"></span>
          <span class="frame-corner frame-corner--bottom-right"></span>
        </div>
        <div class="frame-readout" role="status" aria-live="polite">
          <span class="frame-readout-label">CONTAINMENT VIEW / FRAME CALIBRATION</span>
          <output class="frame-readout-value" id="frame-scale"></output>
          <output class="frame-readout-source" id="source-scale"></output>
        </div>
        <span class="frame-caption">CALIBRATED FRAME / CENTER CROP</span>
      </div>
      <aside class="brand-panel" id="intro-screen" aria-labelledby="game-title">
        <div class="menu-content">
          <h1 class="game-title" id="game-title" data-screen-title tabindex="-1">Mil<span class="game-title-o"><img src="https://static.wikia.nocookie.net/samme/images/f/fe/Milo_Slides.png/revision/latest/scale-to-width-down/360?cb=20260907010126" alt="o" /></span>INC.</h1>
          <button class="begin-button" id="begin-button" type="button">Begin</button>
          <details class="settings-menu">
            <summary>
              <svg class="settings-gear" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="7.5" />
                <circle cx="12" cy="12" r="3" />
                <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1" />
                <path class="settings-gear-marker" d="M12 1.5v2.2" />
              </svg>
              <span>Settings</span>
            </summary>
            <div class="settings-controls">
              <label class="settings-field">
                <span>Theme</span>
                <select id="theme-setting">
                  <option value="facility">Facility / Containment</option>
                  <option value="city">City Outbreak</option>
                  <option value="rasonian">Rasonian Conflict</option>
                </select>
              </label>
              <p class="settings-note">Graphics quality adjusts automatically to your device's performance.</p>
              <label class="settings-field settings-toggle">
                <span>Background music</span>
                <input id="background-music-setting" type="checkbox" checked />
              </label>
              <p class="settings-note" id="settings-status" role="status" hidden></p>
            </div>
          </details>
        </div>
      </aside>
      <section
        class="category-screen"
        id="category-screen"
        aria-labelledby="category-title"
        hidden
      >
        <h1 class="game-title" id="category-title" data-screen-title tabindex="-1">Examination</h1>
        <button class="begin-button category-back" id="category-back-button" type="button">Back to Main Menu</button>
        <div class="category-grid">
          <button class="category-card" type="button" data-category="Enemies"><h2>Enemies</h2></button>
          <button class="category-card" type="button" data-category="Weapons"><h2>Weapons</h2></button>
          <button class="category-card" type="button" data-category="Items"><h2>Items</h2></button>
          <button class="category-card" type="button" data-category="Classes"><h2>Classes</h2></button>
          <button class="category-card" type="button" data-category="Locations"><h2>Locations</h2></button>
          <button class="category-card" type="button" data-category="Mechanics"><h2>Mechanics</h2></button>
          <button class="category-card" type="button" data-category="Events"><h2>Events</h2></button>
          <button class="category-card" type="button" data-category="Badges"><h2>Badges</h2></button>
          <button class="category-card" type="button" data-category="Ranks"><h2>Ranks</h2></button>
          <button class="category-card" type="button" data-category="Guides"><h2>Guides</h2></button>
          <button class="category-card" type="button" data-category="Lore"><h2>Lore</h2></button>
        </div>
      </section>
      <section
        class="category-screen detail-screen"
        id="detail-screen"
        aria-labelledby="detail-title"
        hidden
      >
        <div class="detail-content">
          <div class="detail-header">
            <h1 class="game-title" id="detail-title" data-screen-title tabindex="-1">Enemies</h1>
            <a
              class="wiki-link"
              id="enemy-wiki-link"
              href="https://examination.miraheze.org/wiki/Enemies"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >Open Enemies wiki</a>
          </div>
          <div class="detail-viewport" id="detail-viewport" aria-live="polite"></div>
          <button class="begin-button" id="back-button" type="button">Back</button>
        </div>
      </section>
      <div class="media-modal" id="media-modal" role="dialog" aria-modal="true" aria-label="Media viewer" tabindex="-1" hidden>
        <div class="media-frame">
          <img id="media-image" class="media-image" alt="" hidden />
          <video
            id="media-player"
            playsinline
            tabindex="-1"
            inert
            disablepictureinpicture
            disableremoteplayback
          ></video>
        </div>
      </div>
      <div class="reconstruct-effect" id="reconstruct-effect" aria-hidden="true"></div>
      <div class="analog-horror" aria-hidden="true">
        <img class="analog-ghost" id="analog-ghost" alt="" inert />
        <svg class="analog-noise" viewBox="0 0 640 360" preserveAspectRatio="none">
          <filter id="analog-noise-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="640" height="360" filter="url(#analog-noise-filter)" />
        </svg>
        <span class="analog-label analog-rec">REC <span aria-hidden="true"></span></span>
        <span class="analog-label analog-timestamp">CAM 04 / 02:17:08 AM</span>
      </div>
    </main>
  </body>
</html>
